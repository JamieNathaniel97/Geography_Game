<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geography Game</title>
<meta name="description" content="Learn every country in the world on a map: find the country, offline on your phone.">
<meta name="theme-color" content="#17262b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="bar">
    <button class="iconbtn" id="menuBtn" type="button" aria-label="Menu" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="prompt">
      <div class="eyebrow" id="eyebrow">Find</div>
      <div class="target" id="target">Loading map…</div>
    </div>
    <div class="arrows">
      <button class="btn arrow" id="prev" type="button" aria-label="Previous country">‹</button>
      <button class="btn arrow" id="fwd" type="button" aria-label="Next country">›</button>
    </div>
  </header>
  <div class="subbar">
    <span class="score" id="score"></span>
    <button class="linkbtn" id="giveup" type="button">Give up</button>
  </div>
  <main id="mapwrap">
    <canvas id="map" aria-label="World map. Tap a country."></canvas>
    <div class="mapctl">
      <button class="chip" id="viewBtn" type="button">Flat map</button>
      <button class="chip on" id="bordersBtn" type="button" aria-pressed="true">Borders</button>
      <button class="chip" id="magBtn" type="button" aria-pressed="false">Magnifier</button>
    </div>
    <div class="toast" id="toast" hidden></div>
  </main>
  <nav class="jumpbar" aria-label="Jump to">
    <div class="jumps" id="jumps">
      <button data-v="world" type="button">World</button><button data-v="europe" type="button">Europe</button><button data-v="asia" type="button">Asia</button><button data-v="africa" type="button">Africa</button><button data-v="namerica" type="button">N. America</button><button data-v="carib" type="button">Caribbean</button><button data-v="samerica" type="button">S. America</button><button data-v="oceania" type="button">Oceania</button>
    </div>
  </nav>
</div>

<div class="overlay" id="menu" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
    <div class="sheethead"><h2 id="menuTitle">Menu</h2><button class="btn" id="menuClose" type="button">Close</button></div>
    <div class="field"><span class="label">Game</span>
      <div class="seg" id="segMode"><button data-v="find" class="on" type="button">Find the country</button><button data-v="explore" type="button">Free tap</button></div>
    </div>
    <button class="btn wide" id="newGame" type="button">New game</button>
    <p class="note">Build 1 foundation. Continent games, naming games, capitals, Learning mode and terrain are still to come.</p>
  </div>
</div>

<div class="overlay" id="inset" hidden>
  <div class="inbox">
    <div class="inhead"><span>Magnified. Tap a country, or pinch to zoom.</span><button class="btn" id="insetClose" type="button">Close</button></div>
    <canvas id="insetMap"></canvas>
  </div>
</div>

<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="js/geo.js"></script>
<script src="js/mapview.js"></script>
<script src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
